name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  # -------------------------------------------------------------------------
  # Python: formatting, linting, and unit tests
  # -------------------------------------------------------------------------
  python-checks:
    name: Python Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black flake8 pytest boto3 urllib3

      - name: Black format check
        run: black --check lambda/ tests/

      - name: Flake8 lint
        run: |
          flake8 lambda/handler.py tests/test_handler.py \
            --max-line-length=88 \
            --extend-ignore=E203,W503

      - name: Run unit tests
        run: pytest tests/ -v --tb=short

  # -------------------------------------------------------------------------
  # Terraform: format, init, validate
  # -------------------------------------------------------------------------
  terraform-validate:
    name: Terraform Validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.0

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform init (no backend)
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

  # -------------------------------------------------------------------------
  # Terraform: security posture scan with checkov
  # -------------------------------------------------------------------------
  checkov-scan:
    name: Checkov IaC Security Scan
    runs-on: ubuntu-latest
    needs: terraform-validate

    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          # Soft-fail keeps CI green while you triage findings;
          # set to false once known issues are remediated or suppressed
          soft_fail: true
          output_format: sarif
          output_file_path: checkov-results.sarif

      - name: Upload Checkov results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: checkov-results.sarif

  # -------------------------------------------------------------------------
  # Trivy: filesystem vulnerability scan
  # -------------------------------------------------------------------------
  trivy-scan:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

  # -------------------------------------------------------------------------
  # Terraform plan (PR only — requires AWS credentials secret)
  # -------------------------------------------------------------------------
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: [python-checks, terraform-validate]
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.0

      - name: Terraform init (no backend)
        run: terraform init -backend=false

      - name: Terraform plan
        run: terraform plan -no-color
        continue-on-error: true
